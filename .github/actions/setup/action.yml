name: Setup
description: Setup Node.js and install dependencies

runs:
  using: composite
  steps:
    - name: Enable corepack
      shell: bash
      run: corepack enable
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: 'yarn'

    - name: Install dependencies
      run: |
        yarn install --immutable
      shell: bash
